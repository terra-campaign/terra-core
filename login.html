<!doctype html>
<html lang="es-MX">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#17324d">

    <title>TERRA Platform — Enterprise Territorial Intelligence</title>

    <link rel="icon" href="./favicon.ico">

    <link rel="stylesheet" href="./styles.css">

</head>

<body class="login-page">

    <main class="auth-shell">

        <section class="card auth-card">

            <p class="eyebrow splash-title">
                ENTERPRISE EDITION
            </p>

            <h1>TERRA PLATFORM</h1>

            <p class="login-subtitle">
                Inteligencia de Campañas Territoriales
            </p>

            <form id="loginForm">

                <label>
                    Correo
                    <input
                        id="email"
                        type="email"
                        autocomplete="username"
                        required>
                </label>

                <label>
                    Contraseña
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        minlength="6"
                        required>
                </label>

                <button class="button" type="submit">
                    Ingresar
                </button>

                <p
                    id="loginMessage"
                    class="message"
                    aria-live="polite">
                </p>

          

</form>

<div class="login-footer">

    <span>Versión 2.0 Enterprise</span>

    <span>© TERRA Platform</span>

</div>

<div class="login-social">

    <p>
        ¿Desea conocer más sobre TERRA Platform?
    </p>

    <a
        href="https://www.facebook.com/profile.php?id=61592896314040"
        target="_blank"
        rel="noopener noreferrer"
    >
        📘 Visite nuestra página oficial en Facebook
    </a>

</div>


            
        </section>

    </main>

    <script type="module" src="./login.js"></script>

</body>

</html>
