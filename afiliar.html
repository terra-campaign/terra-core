<!doctype html>

<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Afiliar persona · TERRA Campaign
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7f9;
      color: #1b2630;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0e4268;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 5px 0 0;
      font-size: 1.7rem;
    }

    .shell {
      width: min(760px, calc(100% - 28px));
      margin: 24px auto;
    }

    .card {
      background: white;
      border: 1px solid #d7e0e6;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    label {
      display: block;
      margin-bottom: 16px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #aebbc4;
      border-radius: 8px;
      font: inherit;
    }

    .optional {
      font-weight: 400;
      color: #667580;
      font-size: .9rem;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 400;
    }

    .check input {
      width: auto;
      margin: 0;
    }

    .button {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 12px 17px;
      background: #14679b;
      color: white;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    .button--secondary {
      background: #e8eef2;
      color: #173a50;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .message {
      line-height: 1.5;
    }

    .success {
      border: 2px solid #218739;
      background: #f0faf2;
    }

    .error {
      color: #a11d1d;
      font-weight: 700;
    }

    [hidden] {
      display: none !important;
    }

  </style>

</head>

<body>

  <header>

    <div>
      TERRA CAMPAIGN
    </div>

    <h1>
      Afiliar persona
    </h1>

  </header>


  <main class="shell">

    <section class="card">

      <div class="actions">

        <a
          class="button button--secondary"
          href="./admin.html"
        >
          Inicio
        </a>

      </div>

      <p
        id="sessionStatus"
        class="message"
        role="status"
      >
        Validando acceso…
      </p>

    </section>


    <section
      id="contextCard"
      class="card"
      hidden
    >

      <h2>
        Nueva afiliación
      </h2>

      <p
        id="contextText"
        class="message"
      ></p>

    </section>


    <section
      id="formCard"
      class="card"
      hidden
    >

      <form id="affiliationForm">

        <label>
          Nombre completo *

          <input
            id="personName"
            maxlength="120"
            autocomplete="name"
            required
          >
        </label>


        <label>
          Población *

          <input
            id="personLocality"
            maxlength="120"
            required
          >
        </label>


        <label>
          Teléfono
          <span class="optional">
            — opcional
          </span>

          <input
            id="personPhone"
            inputmode="tel"
            maxlength="20"
            autocomplete="tel"
          >
        </label>


        <label
          id="whatsappRow"
          class="check"
          hidden
        >

          <input
            id="personHasWhatsApp"
            type="checkbox"
          >

          Este teléfono tiene WhatsApp

        </label>


        <label>
          Calle
          <span class="optional">
            — opcional
          </span>

          <input
            id="personStreet"
            maxlength="160"
            autocomplete="street-address"
          >
        </label>


        <label>
          Número
          <span class="optional">
            — opcional
          </span>

          <input
            id="personHouseNumber"
            maxlength="40"
          >
        </label>


        <button
          id="saveButton"
          class="button"
          type="submit"
        >
          Afiliar persona
        </button>


        <p
          id="formStatus"
          class="message"
          role="status"
        ></p>

      </form>

    </section>


    <section
      id="successCard"
      class="card success"
      hidden
    >

      <h2>
        ✅ PERSONA AFILIADA CORRECTAMENTE
      </h2>

      <p
        id="successText"
        class="message"
      ></p>

      <p class="message">
        Ya puede regresar a recepción para validar su primera participación.
      </p>


      <div class="actions">

        <button
          id="anotherButton"
          class="button"
          type="button"
        >
          Afiliar otra persona
        </button>

        <a
          class="button button--secondary"
          href="./admin.html"
        >
          Inicio
        </a>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="./afiliar.js?v=build-118c-3b3e-3a-001"
  ></script>

</body>

</html>
